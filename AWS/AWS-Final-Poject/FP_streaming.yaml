AWSTemplateFormatVersion: '2010-09-09'
Description: 'Ingestion & Streaming Services'

Resources:
########################
#    Kinesis Stream    #  
########################
#Kinesis Stream is a real-time data pipeline service that continuously ingests, stores, and processes.
  KinesisStream:
    Type: AWS::Kinesis::Stream
    Properties:
      Name: 'StockStream'
      ShardCount: 1
      RetentionPeriodHours: 24

########################
#    SQS Dead-letter   #  
########################

  ValidatorDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: validator_dlq
      MessageRetentionPeriod: 86400  # 1 day

########################
# EventBridge Scheduler#  
########################
# EventBridge Scheduler is a fully managed service that lets you run tasks or trigger AWS services(Lambda and kinesis)
  EventBridgeScheduler:
    Type: AWS::Events::Rule
    Properties:
      Name: 'Scheduler'
      ScheduleExpression: 'rate(1 minute)'
      State: 'ENABLED'
      Targets:
        - Arn: !GetAtt KinesisStream.Arn   #actual Kinesis stream ARN
          Id: 'KinesisTarget'
          RoleArn: !ImportValue All-Mighty-EventBridge

##################
#   Api Gateway  #
##################

  ApiGateway:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: 'StockApi'
      Description: 'API Gateway for Stock Data Ingestion'

  ApiResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt ApiGateway.RootResourceId
      PathPart: 'Stock'
      RestApiId: !Ref ApiGateway

  ApiMethod:
    Type: AWS::ApiGateway::Method       
    Properties:
      AuthorizationType: NONE            # endpoint is public
      HttpMethod: POST                   
      ResourceId: !Ref ApiResource      
      RestApiId: !Ref ApiGateway         
      Integration:
        IntegrationHttpMethod: POST      
        Type: AWS_PROXY                  # Sends full request directly to Lambda (proxy mode)
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${StockFetcherLambda.Arn}/invocations  

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    Properties:
      RestApiId: !Ref ApiGateway
      StageName: Prod
    DependsOn: ApiMethod

##################
#Lambda Function #
##################

  StockFetcherApiGatewayInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref StockFetcherLambda
      Principal: apigateway.amazonaws.com

  StockFetcherLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: 'StockFetcher'
      Handler: 'index.handler'
      Role: !ImportValue All-Mighty-Lambda
      Runtime: 'python3.13'
      Timeout: 15
      Environment:
        Variables:
          KINESIS_STREAM_NAME: !Ref KinesisStream
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          from botocore.exceptions import ClientError

          kinesis_client = boto3.client('kinesis')
          stream_name = os.environ['KINESIS_STREAM_NAME']

          def handler(event, context):
              try:
                  body = json.loads(event['body'])
                  symbol = body.get('symbol')
                  price = body.get('price')
                  city = body.get('city')

                  if not symbol or not price:
                      return {
                          'statusCode': 400,
                          'body': json.dumps({'message': 'Missing symbol or price'})
                      }

                  data = {
                      'symbol': symbol,
                      'price': price,
                      'city': city
                  }

                  response = kinesis_client.put_record(
                      StreamName=stream_name,
                      Data=json.dumps(data),
                      PartitionKey=symbol
                  )

                  return {
                      'statusCode': 200,
                      'body': json.dumps({'message': 'Data sent to Kinesis', 'response': response})
                  }

              except ClientError as e:
                  return {
                      'statusCode': 500,
                      'body': json.dumps({'message': 'Error sending data to Kinesis', 'error': str(e)})
                  }
              except Exception as e:
                  return {
                      'statusCode': 500,
                      'body': json.dumps({'message': 'Internal server error', 'error': str(e)})
                  }

##################
#     Outputs    #
##################

Outputs:
  KinesisStreamArn:
    Description: ARN of Kinesis Stream
    Value: !GetAtt KinesisStream.Arn
    Export:
      Name: !Sub "KinesisStreamArn"

  ValidatorDLQArn:
    Description: ARN of Validator DLQ
    Value: !GetAtt ValidatorDLQ.Arn
    Export:
      Name: !Sub "ValidatorDLQArn"

  ApiInvokeURL:
    Description: Invoke URL for Stock API
    Value: !Sub "https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/Prod/Stock"
    Export:
      Name: !Sub "ApiInvokeURL"
